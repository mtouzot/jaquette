[project]
name = "jaquette"
version = "0.1.0"
description = "Unofficial Python client for the public MyBluray API (cover art and title search)."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [
    { name = "Martin TOUZOT", email = "mtouzot@proton.me" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
]

[project.scripts]
jaquette = "jaquette:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true


[tool.ty.environment]
python = ".venv"

[tool.typos.default.extend-words]
categorie = "categorie"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "commitizen>=4.20.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "ty>=0.0.110",
]
docs = [
    "griffe-pydantic>=1.3.2",
    "mkdocstrings[python]>=1.0.8",
    "zensical>=0.1.4",
]
