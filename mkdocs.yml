site_name: jaquette
site_description: Unofficial Python client for the public MyBluray API (cover art and title search).
site_url: https://mtouzot.github.io/jaquette
repo_url: https://github.com/mtouzot/jaquette
repo_name: mtouzot/jaquette
use_directory_urls: true

theme:
  name: material
  variant: modern
  favicon: assets/disc.svg
  icon:
    logo: lucide/disc
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top

plugins:
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            extensions:
              - griffe_pydantic:
                  schema: true
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            filters: ["!^_"]
            heading_level: 2
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg

nav:
  - Home: index.md
  - API Reference:
      - Clients: api/clients.md
      - Models: api/models.md
      - Exceptions: api/exceptions.md
